server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API -> aggregator-back (shu serverdagi 8083-port, docker-compose.yml dagi extra_hosts)
    location /api/ {
        proxy_pass http://host.docker.internal:8083;
        proxy_http_version 1.1;
        # $http_host portni ham saqlaydi — backend redirect qilsa :8084 yo'qolmaydi
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fayl nomiga hash qo'shadi — uzoq keshlash xavfsiz
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: noma'lum yo'llar index.html ga; index.html keshlanmaydi,
    # aks holda deploydan keyin brauzer eski assets'ni so'raydi
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
